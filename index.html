<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Orario ITIS Negrelli</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 24, 38, 0.85);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100vw;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #main-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100dvh - 72px);
      position: relative;
    }

    /* Pannello Mascotte 3D (Sinistra / Alto) */
    #avatar-panel {
      flex: 1.1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .blurred-background {
      position: absolute;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      background: url('./public/img/sfondo.jpg') center/cover no-repeat;
      filter: blur(12px) brightness(0.4);
      z-index: 1;
    }

    .vignette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 35%, rgba(9, 11, 16, 0.85) 100%);
      z-index: 2;
    }

    #avatar-view {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 3;
    }

    #status-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* Pannello Destra: Profilo & Scheda Risposta */
    #map-panel {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      background: #0d111a;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      gap: 14px;
      overflow-y: auto;
    }

    /* Profilo Utente / Docente con Pulsante di Rimozione */
    #user-profile-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #141a29;
      border: 1px solid #242e44;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #user-profile-bar label {
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
    }

    #user-profile-bar input {
      background: #090c14;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      flex: 1;
      outline: none;
    }

    #user-profile-bar input:focus {
      border-color: var(--accent);
    }

    #clear-surname-btn {
      background: rgba(225, 29, 72, 0.15);
      color: #fda4af;
      border: 1px solid rgba(225, 29, 72, 0.4);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    #clear-surname-btn:hover {
      background: rgba(225, 29, 72, 0.3);
      border-color: #f43f5e;
      color: #ffffff;
    }

    /* Card Risposta */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #info-card h3 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: var(--accent);
      line-height: 1.3;
    }

    #card-desc {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    #card-note {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: var(--primary);
      color: white;
      margin-top: 6px;
      margin-right: 6px;
    }

    /* Badge di Posizione Smart con Ombra Pulsante */
    .badge.location {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
      border: 1px solid #60a5fa;
      font-size: 13px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-top: 8px;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.7);
      animation: location-pulse 2s infinite ease-in-out;
    }

    @keyframes location-pulse {
      0%, 100% {
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 18px rgba(59, 130, 246, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 22px rgba(96, 165, 250, 0.95), 0 0 35px rgba(96, 165, 250, 0.6);
        transform: scale(1.03);
      }
    }

    #result-lines {
      margin-top: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .row.heading {
      display: block;
      font-weight: 700;
      color: var(--accent);
      padding-top: 12px;
    }

    .row .when {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .row .main {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .row .sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Barra Input Fisso in Basso */
    #ui-bar {
      flex-shrink: 0;
      width: 100%;
      height: 72px;
      background: #11141c;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
    }

    input[type="text"]#query-input {
      flex: 1;
      max-width: 520px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0a0c10;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]#query-input:focus {
      border-color: var(--primary);
    }

    button.action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      transition: all 0.2s ease;
    }

    button.action-btn:hover { background: var(--primary-hover); }
    button.action-btn:disabled { background: #334155; cursor: not-allowed; }

    /* Pulsante Audio Toggle */
    #audio-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 14px;
    }

    #audio-btn.enabled {
      background: #059669;
      border-color: #10b981;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    #mic-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 18px;
      padding: 11px 14px;
      min-width: 44px;
      min-height: 44px;
    }

    #mic-btn.listening {
      background: #dc2626;
      border-color: #ef4444;
      animation: pulse-mic 1.2s infinite;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 900px) {
      #main-container { flex-direction: column; overflow: hidden; }
      #avatar-panel { flex: none; height: 38dvh; min-height: 38dvh; width: 100%; }
      #map-panel {
        flex: 1; min-height: 0; width: 100%; border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px; gap: 10px;
      }
      .row { grid-template-columns: 95px 1fr; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="main-container">
    <div id="avatar-panel">
      <div class="blurred-background"></div>
      <div class="vignette-overlay"></div>
      <div id="avatar-view"></div>
      <div id="status-overlay">Caricamento assistente...</div>
    </div>

    <div id="map-panel">
      <div id="user-profile-bar">
        <label for="my-surname-input">👤 Il tuo cognome:</label>
        <input type="text" id="my-surname-input" placeholder="Es. Cassarino..." />
        <button id="clear-surname-btn" type="button" title="Rimuovi cognome memorizzato" style="display:none;">✕ Rimuovi</button>
      </div>

      <div class="card" id="info-card" aria-live="polite">
        <h3 id="card-title">In attesa di richiesta...</h3>
        <div>
          <span id="card-badge" style="display:none;" class="badge"></span>
          <span id="card-location-badge" style="display:none;" class="badge location"></span>
        </div>
        <div id="card-desc">Chiedi: «Dove si trova la 4ITA alla terza ora?», «Cosa ha Curtolo domani?» o «Quando è il collegio docenti?»</div>
        <div id="result-lines"></div>
        <div id="card-note"></div>
      </div>
    </div>
  </div>

  <div id="ui-bar">
    <button class="action-btn" id="audio-btn" type="button" title="Attiva/Disattiva Parlato">🔇 Audio OFF</button>
    <input type="text" id="query-input" aria-label="Domanda orario" placeholder="Es. Dove si trova la 4ITA alla terza ora?" disabled />
    <button class="action-btn" id="search-btn" disabled>Cerca</button>
    <button class="action-btn" id="mic-btn" disabled title="Dettatura vocale" aria-label="Attiva microfono">🎙️</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { buildIndex, parseQuery, answer } from './public/js/query-engine.js';

    const avatarContainer = document.getElementById('avatar-view');
    const statusOverlay = document.getElementById('status-overlay');
    const inputField = document.getElementById('query-input');
    const mySurnameInput = document.getElementById('my-surname-input');
    const clearSurnameBtn = document.getElementById('clear-surname-btn');
    const searchBtn = document.getElementById('search-btn');
    const micBtn = document.getElementById('mic-btn');
    const audioBtn = document.getElementById('audio-btn');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const cardBadge = document.getElementById('card-badge');
    const cardLocationBadge = document.getElementById('card-location-badge');
    const cardNote = document.getElementById('card-note');
    const resultLines = document.getElementById('result-lines');

    let orarioIdx = null;
    let isSpeaking = false;
    let isListening = false;

    // Audio parlante DISATTIVATO di default per aule silenziose
    let isAudioEnabled = localStorage.getItem('negrelli_audio_enabled') === 'true';

    function updateAudioUI() {
      if (isAudioEnabled) {
        audioBtn.textContent = '🔊 Audio ON';
        audioBtn.classList.add('enabled');
      } else {
        audioBtn.textContent = '🔇 Audio OFF';
        audioBtn.classList.remove('enabled');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        isSpeaking = false;
      }
    }
    updateAudioUI();

    audioBtn.addEventListener('click', () => {
      isAudioEnabled = !isAudioEnabled;
      localStorage.setItem('negrelli_audio_enabled', isAudioEnabled ? 'true' : 'false');
      updateAudioUI();
    });

    // Gestione Cognome Docente con Persistenza e Rimozione
    let myTeacherName = localStorage.getItem('negrelli_my_surname') || "";
    mySurnameInput.value = myTeacherName;
    clearSurnameBtn.style.display = myTeacherName ? "inline-block" : "none";

    function updateSurnameState() {
      myTeacherName = mySurnameInput.value.trim();
      if (myTeacherName) {
        localStorage.setItem('negrelli_my_surname', myTeacherName);
        clearSurnameBtn.style.display = "inline-block";
        if (orarioIdx) handleQuery("cosa ho oggi");
      } else {
        localStorage.removeItem('negrelli_my_surname');
        clearSurnameBtn.style.display = "none";
      }
    }

    mySurnameInput.addEventListener('input', updateSurnameState);
    mySurnameInput.addEventListener('change', updateSurnameState);

    clearSurnameBtn.addEventListener('click', () => {
      mySurnameInput.value = "";
      myTeacherName = "";
      localStorage.removeItem('negrelli_my_surname');
      clearSurnameBtn.style.display = "none";
      cardTitle.textContent = "In attesa di richiesta...";
      cardBadge.style.display = "none";
      cardLocationBadge.style.display = "none";
      cardDesc.style.display = "block";
      resultLines.replaceChildren();
      cardNote.textContent = "";
    });

    async function loadSchedule() {
      try {
        const res = await fetch('./public/data/orario_completo.json');
        if (!res.ok) throw new Error("File orario_completo.json non trovato");
        const json = await res.json();
        orarioIdx = buildIndex(json);
      } catch (e) {
        console.warn("Caricamento orario_completo.json fallito, fallback su orario.json:", e);
        try {
          const resFallback = await fetch('./public/data/orario.json');
          if (resFallback.ok) {
            const jsonFallback = await resFallback.json();
            orarioIdx = buildIndex({
              meta: { ore: [{ ora: 1, inizio: "7:50" }, { ora: 2, inizio: "8:45" }, { ora: 3, inizio: "9:40" }, { ora: 4, inizio: "11:00" }, { ora: 5, inizio: "11:55" }, { ora: 6, inizio: "12:50" }] },
              docenti: Object.fromEntries(Object.entries(jsonFallback.docenti || {}).map(([k, v]) => [k, { nome: k, senza_nome: false, orario: v }])),
              classi: {},
              aule: jsonFallback.aule || {},
              aule_libere: {}
            });
          }
        } catch (err2) {
          console.error("Nessun database orario disponibile:", err2);
        }
      }
    }

    // Normalizzazione parlata estesa per Web Speech API su tutte le ore (1ª-8ª)
    function sanitizeForSpeech(text) {
      if (!text) return "";
      const ORD = {
        1: "prima", 2: "seconda", 3: "terza", 4: "quarta",
        5: "quinta", 6: "sesta", 7: "settima", 8: "ottava"
      };
      return text
        .replace(/\b([1-8])ª\s*ora\b/gi, (m, n) => `in ${ORD[n] || n} ora`)
        .replace(/\b([1-8])ª\b/gi, (m, n) => ORD[n] || n)
        .replace(/\b1ITA\b/gi, "prima I.T.A.")
        .replace(/\b2ITA\b/gi, "seconda I.T.A.")
        .replace(/\b3ITA\b/gi, "terza I.T.A.")
        .replace(/\b4ITA\b/gi, "quarta I.T.A.")
        .replace(/\b5ITA\b/gi, "quinta I.T.A.")
        .replace(/\b1ITE\b/gi, "prima I.T.E.")
        .replace(/\b1BTA\b/gi, "prima B.T.A.")
        .replace(/\b1BTB\b/gi, "prima B.T.B.")
        .replace(/\b2CAT\b/gi, "seconda C.A.T.")
        .replace(/\b4EE\b/gi, "quarta E.E.")
        .replace(/\bLab\b/gi, "Laboratorio")
        .replace(/\bdisposizione\b/gi, "a disposizione")
        .replace(/\s+/g, " ")
        .trim();
    }

    function speak(speechText) {
      if (!isAudioEnabled) return; // Silent by default for quiet classrooms
      if (!speechText) return;
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }

      const cleanText = sanitizeForSpeech(speechText);
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'it-IT';
      utterance.rate = 1.02;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const itVoice = voices.find(v => v.lang.includes('it') && (v.name.includes('Elsa') || v.name.includes('Alice') || v.name.includes('Federica') || v.name.includes('Google') || v.name.includes('Natural')));
      if (itVoice) utterance.voice = itVoice;

      utterance.onstart = () => {
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
      };

      utterance.onerror = () => {
        isSpeaking = false;
      };

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Rendering sicuro del contenuto e del Badge di Posizione Smart
    function renderAnswer(a) {
      cardTitle.textContent = a.title || "";
      cardBadge.style.display = a.badge ? "inline-block" : "none";
      cardBadge.textContent = a.badge || "";
      cardDesc.style.display = (a.lines && a.lines.length) ? "none" : "block";
      cardNote.textContent = a.note || "";

      // Determinazione Smart di Piano e Aula con ombra pulsante
      const roomNames = a.rooms || [];
      const roomNumbers = [];
      let isPalestra = false;
      let isRizzarda = false;
      let primaryRoomName = "";

      roomNames.forEach(rName => {
        if (/palestra/i.test(rName)) isPalestra = true;
        if (/rizzarda/i.test(rName)) isRizzarda = true;
        const numMatch = rName.match(/\b\d{3}\b/);
        if (numMatch && !roomNumbers.includes(numMatch[0])) roomNumbers.push(numMatch[0]);
        if (!primaryRoomName && rName) primaryRoomName = rName;
      });

      if (roomNumbers.length > 0) {
        const firstNum = roomNumbers[0];
        const floorChar = firstNum[0];
        let floorText = "PIANO TERRA";
        if (floorChar === '1') floorText = "1° PIANO";
        else if (floorChar === '2') floorText = "2° PIANO";

        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = `📍 ${floorText} • AULA ${firstNum}`;
      } else if (isPalestra) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "📍 PIANO TERRA • PALESTRA";
      } else if (isRizzarda) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "📍 SEDE RIZZARDA";
      } else if (primaryRoomName) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = `📍 ${primaryRoomName.toUpperCase()}`;
      } else {
        cardLocationBadge.style.display = "none";
      }

      resultLines.replaceChildren(...(a.lines || []).map(l => {
        const row = document.createElement('div');
        row.className = 'row' + (l.heading ? ' heading' : '');

        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = l.when || "";
        row.appendChild(when);

        if (!l.heading) {
          const body = document.createElement('div');
          const main = document.createElement('div');
          main.className = 'main';
          main.textContent = l.main || "";
          body.appendChild(main);

          if (l.sub) {
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = l.sub;
            body.appendChild(sub);
          }
          row.appendChild(body);
        }
        return row;
      }));
    }

    function handleQuery(text) {
      if (!orarioIdx) {
        speak("Il database dell'orario non è ancora disponibile.");
        return;
      }
      const parsed = parseQuery(text, orarioIdx, { now: new Date(), me: myTeacherName });
      const a = answer(parsed, orarioIdx);
      renderAnswer(a);
      speak(a.speech);
    }

    // NegrelliBot 3D Mascot Renderer (Mascolino/Femminile Neutro Hi-Tech Robot)
    function initNegrelliBot(container) {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 0.15, 3.7);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.replaceChildren(renderer.domElement);

      // Illuminazione Ambientale & Punti Luce Studiati per Colori Chiari e Brillanti
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.8);
      mainLight.position.set(3, 5, 4);
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0xe0f2fe, 1.8);
      fillLight.position.set(-3, 2, 3);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xbae6fd, 1.2);
      backLight.position.set(0, -3, -2);
      scene.add(backLight);

      // Gruppo Principale Robot
      const robotGroup = new THREE.Group();
      scene.add(robotGroup);

      // Materiali Chiari e Moderni (Ceramica Bianca, Argento Lucido, Accenti Azzurro Negrelli)
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.15, roughness: 0.2 });
      const silverMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.75, roughness: 0.2 });
      const visorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1 });
      const ledMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, emissive: 0x38bdf8, emissiveIntensity: 2.0 });
      const mouthMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, emissive: 0x38bdf8, emissiveIntensity: 1.8 });
      const badgeMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x1d4ed8, emissiveIntensity: 1.0 });

      // Torso
      const torsoGeo = new THREE.CylinderGeometry(0.55, 0.45, 0.8, 32);
      const torso = new THREE.Mesh(torsoGeo, bodyMat);
      torso.position.y = -0.5;
      robotGroup.add(torso);

      // Canvas dinamico per Logo ITIS Negrelli sul petto (5 Rami Disciplinari)
      const logoCanvas = document.createElement('canvas');
      logoCanvas.width = 512;
      logoCanvas.height = 512;
      const logoCtx = logoCanvas.getContext('2d');
      const logoTexture = new THREE.CanvasTexture(logoCanvas);
      logoTexture.anisotropy = 16;
      logoTexture.center.set(0.5, 0.5);
      logoTexture.rotation = Math.PI / 2;

      function updateLogoCanvas(time) {
        const w = 512, h = 512;
        logoCtx.clearRect(0, 0, w, h);

        // Piastra di fondo circolare con bordo cyan
        logoCtx.save();
        logoCtx.beginPath();
        logoCtx.arc(w / 2, h / 2, 235, 0, Math.PI * 2);
        logoCtx.fillStyle = '#0f172a';
        logoCtx.fill();
        logoCtx.lineWidth = 8;
        logoCtx.strokeStyle = '#38bdf8';
        logoCtx.stroke();
        logoCtx.restore();

        // 5 Nodi dell'albero ITIS Negrelli (Posizioni e Colori ufficiali)
        const nodes = [
          { x: 140, y: 220, r: 38, color: '#0284c7', type: 'gear' },  // Meccanica/Automazione
          { x: 185, y: 125, r: 38, color: '#9333ea', type: 'chart' }, // Economia/Gestione
          { x: 256, y: 85,  r: 38, color: '#ea580c', type: 'dna' },   // Biotecnologie/Scienze
          { x: 327, y: 125, r: 38, color: '#06b6d4', type: 'chip' },  // Informatica/Elettronica
          { x: 372, y: 220, r: 38, color: '#16a34a', type: 'globe' }  // Ambiente/Territorio
        ];

        // Ramo/Tronco e Radici Grigie
        logoCtx.strokeStyle = '#64748b';
        logoCtx.lineCap = 'round';
        logoCtx.lineJoin = 'round';

        // Rami ai 5 nodi
        logoCtx.lineWidth = 14;
        nodes.forEach(n => {
          logoCtx.beginPath();
          logoCtx.moveTo(256, 270);
          logoCtx.quadraticCurveTo(256 + (n.x - 256) * 0.4, 180, n.x, n.y);
          logoCtx.stroke();
        });

        // Tronco Centrale
        logoCtx.lineWidth = 26;
        logoCtx.beginPath();
        logoCtx.moveTo(256, 250);
        logoCtx.lineTo(256, 360);
        logoCtx.stroke();

        // Radici intrecciate
        logoCtx.lineWidth = 12;
        logoCtx.beginPath();
        logoCtx.moveTo(256, 350);
        logoCtx.bezierCurveTo(200, 370, 150, 410, 130, 450);
        logoCtx.moveTo(256, 350);
        logoCtx.bezierCurveTo(256, 400, 275, 430, 260, 465);
        logoCtx.moveTo(256, 350);
        logoCtx.bezierCurveTo(310, 370, 360, 410, 380, 450);
        logoCtx.stroke();

        // Animazione "Cuore Pulsante a Zone"
        const heartSpeed = time * 3.5;

        nodes.forEach((n, idx) => {
          const phase = idx * 1.25;
          const pulse = Math.pow(Math.max(0, Math.sin(heartSpeed - phase)), 3);
          const currentScale = 1.0 + pulse * 0.28;
          const currentR = n.r * currentScale;

          logoCtx.save();
          logoCtx.translate(n.x, n.y);

          // Alone Luminoso in dissolvenza (Heart Glow)
          if (pulse > 0.02) {
            logoCtx.beginPath();
            logoCtx.arc(0, 0, currentR + 16 * pulse, 0, Math.PI * 2);
            logoCtx.fillStyle = n.color;
            logoCtx.globalAlpha = pulse * 0.65;
            logoCtx.fill();
            logoCtx.globalAlpha = 1.0;
          }

          // Gemma Colorata (Foglia)
          logoCtx.beginPath();
          logoCtx.arc(0, 0, currentR, 0, Math.PI * 2);
          logoCtx.fillStyle = n.color;
          logoCtx.fill();
          logoCtx.lineWidth = 4;
          logoCtx.strokeStyle = '#ffffff';
          logoCtx.stroke();

          // Icona Interna Bianca
          logoCtx.fillStyle = '#ffffff';
          logoCtx.strokeStyle = '#ffffff';
          logoCtx.lineWidth = 3;

          if (n.type === 'gear') {
            logoCtx.beginPath();
            logoCtx.arc(0, 0, 10 * currentScale, 0, Math.PI * 2);
            logoCtx.stroke();
            for (let a = 0; a < 6; a++) {
              const ang = (a * Math.PI) / 3;
              logoCtx.fillRect(Math.cos(ang) * 10 * currentScale - 2.5, Math.sin(ang) * 10 * currentScale - 2.5, 5, 5);
            }
          } else if (n.type === 'chart') {
            logoCtx.fillRect(-10 * currentScale, 2 * currentScale, 4 * currentScale, 9 * currentScale);
            logoCtx.fillRect(-3 * currentScale, -4 * currentScale, 4 * currentScale, 15 * currentScale);
            logoCtx.fillRect(4 * currentScale, -10 * currentScale, 4 * currentScale, 21 * currentScale);
          } else if (n.type === 'dna') {
            logoCtx.beginPath();
            logoCtx.arc(0, -5 * currentScale, 5 * currentScale, 0, Math.PI);
            logoCtx.arc(0, 5 * currentScale, 5 * currentScale, Math.PI, 0);
            logoCtx.stroke();
          } else if (n.type === 'chip') {
            logoCtx.fillRect(-9 * currentScale, -9 * currentScale, 18 * currentScale, 18 * currentScale);
            logoCtx.fillStyle = n.color;
            logoCtx.fillRect(-4 * currentScale, -4 * currentScale, 8 * currentScale, 8 * currentScale);
          } else if (n.type === 'globe') {
            logoCtx.beginPath();
            logoCtx.arc(0, 0, 11 * currentScale, 0, Math.PI * 2);
            logoCtx.stroke();
            logoCtx.beginPath();
            logoCtx.moveTo(-11 * currentScale, 0); logoCtx.lineTo(11 * currentScale, 0);
            logoCtx.moveTo(0, -11 * currentScale); logoCtx.lineTo(0, 11 * currentScale);
            logoCtx.stroke();
          }

          logoCtx.restore();
        });

        logoTexture.needsUpdate = true;
      }

      // Badge Emblema ITIS Negrelli sul petto (Cilindro 3D non compenetrato)
      const badgeGroup = new THREE.Group();
      badgeGroup.position.set(0, -0.4, 0.52);

      const badgeGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.04, 64);
      const badgeSideMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.8, roughness: 0.2 });
      const badgeFaceMat = new THREE.MeshStandardMaterial({
        map: logoTexture,
        emissiveMap: logoTexture,
        emissive: 0xffffff,
        emissiveIntensity: 0.35,
        roughness: 0.2,
        metalness: 0.1
      });

      // Materiali cilindro: [lato, cappuccio_superiore, cappuccio_inferiore]
      const badgeMesh = new THREE.Mesh(badgeGeo, [badgeSideMat, badgeFaceMat, badgeFaceMat]);
      badgeMesh.rotation.x = Math.PI / 2;
      badgeGroup.add(badgeMesh);

      robotGroup.add(badgeGroup);

      // Spalline
      const shoulderGeo = new THREE.SphereGeometry(0.16, 16, 16);
      const leftShoulder = new THREE.Mesh(shoulderGeo, silverMat);
      leftShoulder.position.set(-0.65, -0.25, 0);
      robotGroup.add(leftShoulder);

      const rightShoulder = new THREE.Mesh(shoulderGeo, silverMat);
      rightShoulder.position.set(0.65, -0.25, 0);
      robotGroup.add(rightShoulder);

      // Collo
      const neckGeo = new THREE.CylinderGeometry(0.15, 0.18, 0.18, 16);
      const neck = new THREE.Mesh(neckGeo, silverMat);
      neck.position.y = -0.05;
      robotGroup.add(neck);

      // Gruppo Testa
      const headGroup = new THREE.Group();
      headGroup.position.y = 0.35;
      robotGroup.add(headGroup);

      const headGeo = new THREE.BoxGeometry(0.9, 0.75, 0.7, 8, 8, 8);
      const headMesh = new THREE.Mesh(headGeo, bodyMat);
      headGroup.add(headMesh);

      // Visore Occhi
      const visorGeo = new THREE.BoxGeometry(0.76, 0.42, 0.1);
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 0.05, 0.31);
      headGroup.add(visor);

      // Occhi LED
      const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
      const leftEye = new THREE.Mesh(eyeGeo, ledMat);
      leftEye.scale.set(1, 1, 0.4);
      leftEye.position.set(-0.2, 0.08, 0.36);
      headGroup.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, ledMat);
      rightEye.scale.set(1, 1, 0.4);
      rightEye.position.set(0.2, 0.08, 0.36);
      headGroup.add(rightEye);

      // Bocca LED Parlante
      const mouthGeo = new THREE.BoxGeometry(0.35, 0.05, 0.02);
      const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
      mouthMesh.position.set(0, -0.1, 0.37);
      headGroup.add(mouthMesh);

      // Antenna Top
      const antennaStemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.25);
      const antennaStem = new THREE.Mesh(antennaStemGeo, silverMat);
      antennaStem.position.set(0, 0.5, 0);
      headGroup.add(antennaStem);

      const antennaTipGeo = new THREE.SphereGeometry(0.06, 16, 16);
      const antennaTip = new THREE.Mesh(antennaTipGeo, ledMat);
      antennaTip.position.set(0, 0.65, 0);
      headGroup.add(antennaTip);

      // Orecchie laterali
      const earGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 16);
      const leftEar = new THREE.Mesh(earGeo, silverMat);
      leftEar.rotation.z = Math.PI / 2;
      leftEar.position.set(-0.48, 0.05, 0);
      headGroup.add(leftEar);

      const rightEar = new THREE.Mesh(earGeo, silverMat);
      rightEar.rotation.z = Math.PI / 2;
      rightEar.position.set(0.48, 0.05, 0);
      headGroup.add(rightEar);

      // Animazioni
      let clock = new THREE.Clock();
      let mouseX = 0, mouseY = 0;
      let targetMouseX = 0, targetMouseY = 0;
      let blinkTimer = 0;

      window.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / window.innerWidth - 0.5) * 0.8;
        targetMouseY = (e.clientY / window.innerHeight - 0.5) * 0.6;
      });

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // Fluttuazione Robot (Sinusoidale)
        robotGroup.position.y = Math.sin(time * 2.0) * 0.08;
        robotGroup.rotation.y = Math.sin(time * 0.8) * 0.05;

        // Inseguimento Mouse
        mouseX += (targetMouseX - mouseX) * 0.08;
        mouseY += (targetMouseY - mouseY) * 0.08;
        headGroup.rotation.y = mouseX;
        headGroup.rotation.x = mouseY;

        // Eyelid Blink (Battito Ciglia casuale)
        blinkTimer += 0.016;
        if (blinkTimer > 3.5) {
          leftEye.scale.y = 0.1;
          rightEye.scale.y = 0.1;
          if (blinkTimer > 3.7) {
            leftEye.scale.y = 1;
            rightEye.scale.y = 1;
            blinkTimer = 0;
          }
        }

        // Aggiornamento Canvas Animato per Logo ITIS Negrelli (Cuore Pulsante a Zone)
        updateLogoCanvas(time);
        const heartPulse = Math.max(0, Math.sin(time * 3.5));
        badgeGroup.scale.setScalar(1.0 + heartPulse * 0.03);

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    async function init() {
      await loadSchedule();

      try {
        initNegrelliBot(avatarContainer);
      } catch (err) {
        console.warn("Rendering NegrelliBot 3D fallito:", err);
      } finally {
        statusOverlay.style.display = 'none';
        inputField.disabled = false;
        searchBtn.disabled = false;
        micBtn.disabled = false;
      }

      function submitSearch() {
        const val = inputField.value.trim();
        if (val) handleQuery(val);
      }

      searchBtn.addEventListener('click', submitSearch);
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      // Microfono Web Speech
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognizer = new SpeechRecognition();
        recognizer.lang = 'it-IT';
        recognizer.continuous = false;

        micBtn.addEventListener('click', () => {
          if (isListening) {
            try { recognizer.stop(); } catch(e){}
            isListening = false;
            micBtn.classList.remove('listening');
          } else {
            try {
              recognizer.start();
              isListening = true;
              micBtn.classList.add('listening');
            } catch(e) {
              isListening = false;
              micBtn.classList.remove('listening');
            }
          }
        });

        recognizer.onresult = (evt) => {
          const spokenText = evt.results[0][0].transcript;
          inputField.value = spokenText;
          handleQuery(spokenText);
        };

        recognizer.onend = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };

        recognizer.onerror = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };
      } else {
        micBtn.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
