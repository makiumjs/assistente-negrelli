    function renderMap(floor, highlightList = null) {
      currentFloor = floor;
      floorButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.floor === floor);
      });

      if (highlightList !== null) {
        activeHighlightRooms = Array.isArray(highlightList) ? highlightList : [highlightList];
      }

      mapRoomsGroup.innerHTML = '';
      const rooms = floorLayouts[floor] || [];

      rooms.forEach(r => {
        const isTarget = activeHighlightRooms.some(target => 
          r.id === target || r.name.toLowerCase().includes(target.toLowerCase())
        );

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", r.x);
        rect.setAttribute("y", r.y);
        rect.setAttribute("width", r.w);
        rect.setAttribute("height", r.h);
        rect.setAttribute("class", `room ${isTarget ? 'highlight' : ''}`);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", r.x + r.w / 2);

        text.textContent = r.name;

        mapRoomsGroup.appendChild(rect);
        mapRoomsGroup.appendChild(text);
      });
    }

    async function loadSchedule() {
      try {
        const res = await fetch('./public/data/orario.json');
        if (!res.ok) throw new Error();
        const json = await res.json();
        orarioDb = json.docenti;
      } catch (e) {
        console.warn("Database orario.json non disponibile.");
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      activeUtterance = utterance;
      utterance.lang = 'it-IT';
      utterance.rate = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const itVoice = voices.find(v => v.lang.startsWith('it') || v.lang.startsWith('IT'));
      if (itVoice) utterance.voice = itVoice;

      utterance.onstart = () => { isSpeaking = true; };
      utterance.onend = () => { isSpeaking = false; activeUtterance = null; };
      utterance.onerror = () => { isSpeaking = false; activeUtterance = null; };

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function normalizeForSearch(str) {
      return (str || '')
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Confronta due ore per accorparle se identiche
    function areSlotsEqual(a, b) {
      if (!a || !b) return false;
      if (a.tipo !== b.tipo) return false;
      if (a.tipo === "disposizione") {
        return (a.aula || "") === (b.aula || "");
      }
      return a.materia === b.materia &&
             a.classe === b.classe &&
             a.aula === b.aula &&
             a.copresenza === b.copresenza;
    }

    // Formattazione naturale dell'intervallo ore
    function formatHourSpan(startH, endH) {
      const ords = { 1: "prima", 2: "seconda", 3: "terza", 4: "quarta", 5: "quinta" };
      if (startH === endH) {
        return `in ${ords[startH]} ora`;
      }
      if (endH - startH === 1) {
        return `in ${ords[startH]} e ${ords[endH]} ora`;
      }
      return `dalla ${ords[startH]} alla ${ords[endH]} ora`;
    }

    function describeGroup(g) {
      const timeSpan = formatHourSpan(g.startHour, g.endHour);
      const s = g.slot;
      if (s.tipo === "disposizione") {
        return `${timeSpan} è a disposizione${s.aula ? ' in ' + s.aula : ''}`;
      } else {
        let desc = `${timeSpan} ha ${s.materia}`;
        if (s.classe) desc += ` con la ${s.classe}`;
        if (s.aula) desc += ` in ${s.aula}`;
        if (s.copresenza) desc += ` insieme a ${s.copresenza}`;
        return desc;
      }
    }

    function parseNaturalQuery(text) {
      const q = normalizeForSearch(text);

      // 1. Docente (ordinamento per lunghezza decrescente)
      const profKeys = Object.keys(orarioDb || {}).sort((a, b) => b.length - a.length);

      let docente = profKeys.find(p => {
        const cleanP = normalizeForSearch(p);
        const regex = new RegExp(`(^|\\s)${cleanP}(\\s|$)`, 'i');
        return regex.test(q);
      });

      if (!docente) {
        docente = profKeys.find(p => q.includes(normalizeForSearch(p)));
      }

      if (!docente) return { error: "DOCENTE_NOT_FOUND" };

      // 2. Giorno
      let targetDay = null;
      for (const d of ["lunedi", "martedi", "mercoledi", "giovedi", "venerdi", "sabato"]) {
        if (q.includes(d)) { targetDay = d; break; }
      }

      const now = new Date();
      if (!targetDay) {
        if (q.includes("domani")) targetDay = DAYS[(now.getDay() + 1) % 7];
        else targetDay = DAYS[now.getDay()];
      }

      if (targetDay === "domenica") return { error: "SUNDAY", docente };

      // 3. Verifica richiesta ora esplicita o in tempo reale
      let targetHour = null;
      let isRealTime = false;

      const hourWords = { "prima": "1", "seconda": "2", "terza": "3", "quarta": "4", "quinta": "5" };
      for (const [w, h] of Object.entries(hourWords)) {
        if (new RegExp(`\\b${w}\\b`).test(q)) { targetHour = h; break; }
      }

      if (!targetHour) {
        const matchExplicit = q.match(/(?:alla|alle|ora|ore)?\s*\b([1-5])\s*(?:ª|°|a|ora|ore)\b/) || q.match(/\b(?:ora|ore)\s*([1-5])\b/);
        if (matchExplicit) {
          targetHour = matchExplicit[1];
        } else {
          // Se compare una cifra 1-5 isolata non legata a classi (es. "Curtolo lunedì 2")
          const matchDigit = q.match(/\b([1-5])\b/);
          if (matchDigit && !q.match(/\b[1-5]\s*[a-z]{2,3}\b/)) {
            targetHour = matchDigit[1];
          }
        }
      }

      if (q.includes("adesso") || q.includes("in questo momento") || q.includes("ora attuale") || q.includes("attualmente")) {
        isRealTime = true;
        const totalMinutes = now.getHours() * 60 + now.getMinutes();
        if (totalMinutes >= 480 && totalMinutes < 535) targetHour = "1";
        else if (totalMinutes >= 535 && totalMinutes < 590) targetHour = "2";
        else if (totalMinutes >= 590 && totalMinutes < 660) targetHour = "3";
        else if (totalMinutes >= 660 && totalMinutes < 720) targetHour = "4";
        else if (totalMinutes >= 720 && totalMinutes < 795) targetHour = "5";
        else targetHour = "1";
      }

      // Se non è stata richiesta un'ora specifica né l'orario in tempo reale, restituisce la giornata intera
      const isFullDay = !targetHour && !isRealTime;

      return { docente, targetDay, targetHour, isFullDay };
    }

    function handleQuery(text) {
      if (!orarioDb) {
        speak("Il database dell'orario non è ancora disponibile.");
        return;
      }

      const res = parseNaturalQuery(text);

      if (res.error === "DOCENTE_NOT_FOUND") {
        cardTitle.textContent = "Docente non trovato";
        cardDesc.textContent = "Verifica la correttezza del cognome inserito.";
        cardBadge.style.display = "none";
        speak("Non ho trovato questo docente. Prova a specificare solo il cognome.");
        return;
      }

      if (res.error === "SUNDAY") {
        cardTitle.textContent = `Prof. ${res.docente}`;
        cardDesc.textContent = "L'istituto è chiuso di domenica.";
        cardBadge.style.display = "inline-block";
        cardBadge.textContent = "DOMENICA";
        speak("Di domenica la scuola è chiusa.");
        return;
      }

      const { docente, targetDay, targetHour, isFullDay } = res;
      const daySchedule = orarioDb[docente]?.[targetDay] || {};

      cardTitle.textContent = `Prof. ${docente}`;
      cardBadge.style.display = "inline-block";

      // CASO A: GIORNATA INTERA (Riepilogo completo con accorpamento ore consecutive)
      if (isFullDay) {
        cardBadge.textContent = `${targetDay.toUpperCase()} • GIORNATA INTERA`;

        // Raggruppa le ore consecutive identiche
        const groups = [];
        let cur = null;

        for (let h = 1; h <= 5; h++) {
          const s = daySchedule[String(h)];
          if (!s) {
            if (cur) { groups.push(cur); cur = null; }
            continue;
          }
          if (cur && areSlotsEqual(cur.slot, s) && cur.endHour === h - 1) {
            cur.endHour = h;
          } else {
            if (cur) groups.push(cur);
            cur = { startHour: h, endHour: h, slot: s };
          }
        }
        if (cur) groups.push(cur);

        if (groups.length === 0) {
          cardDesc.textContent = `Nessuna lezione prevista per la giornata di ${targetDay}.`;
          speak(`Il professor ${docente} ${targetDay} non ha lezioni in orario.`);
          renderMap(currentFloor, []);
          return;
        }

        // Scheda descrittiva HTML compatta
        let htmlDesc = `<div style="display:flex; flex-direction:column; gap:4px;">`;
        const roomNumbers = [];

        groups.forEach(g => {
          const timeSpanStr = g.startHour === g.endHour ? `${g.startHour}ª ora` : `${g.startHour}ª-${g.endHour}ª ora`;
          const s = g.slot;

          if (s.aula) {
            const m = s.aula.match(/\b(\d{3})\b/);
            if (m && !roomNumbers.includes(m[1])) roomNumbers.push(m[1]);
          }

          if (s.tipo === "disposizione") {
            htmlDesc += `<div><strong>${timeSpanStr}:</strong> Disposizione ${s.aula ? '(' + s.aula + ')' : ''}</div>`;
          } else {
            htmlDesc += `<div><strong>${timeSpanStr}:</strong> <strong>${s.aula || 'N.D.'}</strong> • ${s.classe} <small style="color:var(--text-muted)">(${s.materia})</small></div>`;
          }
        });
        htmlDesc += `</div>`;
        cardDesc.innerHTML = htmlDesc;

        // Evidenzia le aule sulla mappa (seleziona il piano della prima aula trovata)
        if (roomNumbers.length > 0) {
          const firstFloor = roomNumbers[0][0];
          renderMap(['0', '1', '2'].includes(firstFloor) ? firstFloor : currentFloor, roomNumbers);
        } else {
          renderMap(currentFloor, []);
        }

        // Generazione del messaggio vocale fluido
        let spokenMsg = `${targetDay} il professor ${docente} `;
        if (groups.length === 1) {
          spokenMsg += `${describeGroup(groups[0])}.`;
        } else if (groups.length === 2) {
          spokenMsg += `${describeGroup(groups[0])}, e ${describeGroup(groups[1])}.`;
        } else {
          spokenMsg += groups.slice(0, -1).map(describeGroup).join(", ") + `, e ${describeGroup(groups[groups.length - 1])}.`;
        }

        speak(spokenMsg);
        return;
      }

      // CASO B: ORA SINGOLA SPECIFICA
      cardBadge.textContent = `${targetDay.toUpperCase()} • ${targetHour}ª ORA`;
      const slot = daySchedule[targetHour];

      if (!slot) {
        cardDesc.textContent = "Nessuna lezione prevista (Ora buca o non in servizio).";
        speak(`Il professor ${docente} ${targetDay} alla ${targetHour}ª ora non ha lezione.`);
        renderMap(currentFloor, []);
      } else if (slot.tipo === "disposizione") {
        cardDesc.textContent = `A disposizione ${slot.aula ? 'in ' + slot.aula : 'nell\'istituto'}.`;
        speak(`Il professor ${docente} ${targetDay} alla ${targetHour}ª ora è a disposizione.`);
        if (slot.aula) {
          const m = slot.aula.match(/\b(\d{3})\b/);
          if (m && ['0', '1', '2'].includes(m[1][0])) renderMap(m[1][0], [m[1]]);
        }
      } else {
        cardDesc.innerHTML = `<strong>${slot.aula}</strong> • Classe <strong>${slot.classe}</strong><br><small style="color: #94a3b8;">${slot.materia}</small>`;
        if (slot.aula) {
          const m = slot.aula.match(/\b(\d{3})\b/);
          if (m && ['0', '1', '2'].includes(m[1][0])) renderMap(m[1][0], [m[1]]);
        }

        let msg = `Il professor ${docente} ${targetDay} alla ${targetHour}ª ora si trova in ${slot.aula} con la classe ${slot.classe} per ${slot.materia}.`;
        if (slot.copresenza) msg += ` Insieme al docente ${slot.copresenza}.`;
        speak(msg);
      }
    }

    function updateMouthAnimation(now) {
      if (now === lastJawUpdate) return;
      lastJawUpdate = now;

      if (isSpeaking) {
        const t = now * 0.015;
        const rawWave = Math.sin(t) * 0.5 + Math.sin(t * 1.8) * 0.3 + Math.sin(t * 0.4) * 0.2;
        const targetJaw = Math.max(0, Math.min(0.75, rawWave * 1.2));
        currentJaw += (targetJaw - currentJaw) * 0.35;
      } else {
        currentJaw += (0 - currentJaw) * 0.25;
        if (currentJaw < 0.005) currentJaw = 0;
      }
    }

    async function init() {
      renderMap("2");
      floorButtons.forEach(btn => {
        btn.addEventListener('click', () => renderMap(btn.dataset.floor, activeHighlightRooms));
      });

      await loadSchedule();

      const head = new TalkingHead(avatarContainer, {
        ttsEndpoint: "https://dummy-tts.local",
        cameraView: "upper"
      });

      await head.showAvatar({
        url: './public/models/avatar.glb',
        body: 'F',
        avatarMood: 'neutral'
      });

      if (head.renderer) {
        head.renderer.setClearColor(0x000000, 0);
        head.renderer.domElement.style.background = 'transparent';
      }
      if (head.scene) {
        head.scene.background = null;
      }

      head.scene.traverse((node) => {
        if (node.isMesh && node.morphTargetDictionary) {
          const dict = node.morphTargetDictionary;
          const jawIdx = dict['jawOpen'] ?? dict['mouthOpen'] ?? dict['viseme_aa'];
          const funnelIdx = dict['mouthFunnel'] ?? dict['viseme_O'];

          if (jawIdx !== undefined) {
            morphMeshes.push({ mesh: node, jawIdx, funnelIdx });
            node.onBeforeRender = () => {
              updateMouthAnimation(performance.now());
              node.morphTargetInfluences[jawIdx] = currentJaw;
              if (funnelIdx !== undefined) node.morphTargetInfluences[funnelIdx] = currentJaw * 0.3;
            };
          }
        }
      });

      statusOverlay.style.display = 'none';
      inputField.disabled = false;
      searchBtn.disabled = false;
      micBtn.disabled = false;

      function submitSearch() {
        const val = inputField.value.trim();
        if (val) handleQuery(val);
      }

      searchBtn.addEventListener('click', submitSearch);
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognizer = new SpeechRecognition();
        recognizer.lang = 'it-IT';
        recognizer.continuous = false;

        micBtn.addEventListener('click', () => {
          try {
            recognizer.start();
            micBtn.classList.add('listening');
          } catch(e) { recognizer.stop(); }
        });

        recognizer.onresult = (evt) => {
          const spokenText = evt.results[0][0].transcript;
          inputField.value = spokenText;
          handleQuery(spokenText);
        };

        recognizer.onend = () => micBtn.classList.remove('listening');
        recognizer.onerror = () => micBtn.classList.remove('listening');
      } else {
        micBtn.style.display = 'none';
      }

      window.addEventListener('resize', () => {
        if (head && typeof head.onResize === 'function') {
          head.onResize();
        }
      });
    }

    init();
  </script>
</body>
</html>
