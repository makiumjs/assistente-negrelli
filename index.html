<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Orario ITIS Negrelli</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 24, 38, 0.85);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100vw;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #main-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100dvh - 72px);
      position: relative;
    }

    /* Pannello Avatar 3D (Sinistra / Alto) */
    #avatar-panel {
      flex: 1.1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .blurred-background {
      position: absolute;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      background: url('./public/img/sfondo.jpg') center/cover no-repeat;
      filter: blur(12px) brightness(0.45);
      z-index: 1;
    }

    .vignette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(9, 11, 16, 0.8) 100%);
      z-index: 2;
    }

    #avatar-view {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 3;
    }

    #status-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* Pannello Destra: Profilo & Scheda Risposta */
    #map-panel {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      background: #0d111a;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      gap: 14px;
      overflow-y: auto;
    }

    /* Profilo Utente / Docente */
    #user-profile-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #141a29;
      border: 1px solid #242e44;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #user-profile-bar label {
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
    }

    #user-profile-bar input {
      background: #090c14;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      flex: 1;
      outline: none;
    }

    #user-profile-bar input:focus {
      border-color: var(--accent);
    }

    /* Card Risposta */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #info-card h3 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: var(--accent);
      line-height: 1.3;
    }

    #card-desc {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    #card-note {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: var(--primary);
      color: white;
      margin-top: 6px;
      margin-right: 6px;
    }

    /* Badge di Posizione Smart con Ombra Pulsante */
    .badge.location {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
      border: 1px solid #60a5fa;
      font-size: 13px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-top: 8px;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.7);
      animation: location-pulse 2s infinite ease-in-out;
    }

    @keyframes location-pulse {
      0%, 100% {
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 18px rgba(59, 130, 246, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 22px rgba(96, 165, 250, 0.95), 0 0 35px rgba(96, 165, 250, 0.6);
        transform: scale(1.03);
      }
    }

    #result-lines {
      margin-top: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .row.heading {
      display: block;
      font-weight: 700;
      color: var(--accent);
      padding-top: 12px;
    }

    .row .when {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .row .main {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .row .sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Barra Input Fisso in Basso */
    #ui-bar {
      flex-shrink: 0;
      width: 100%;
      height: 72px;
      background: #11141c;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
    }

    input[type="text"]#query-input {
      flex: 1;
      max-width: 560px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0a0c10;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]#query-input:focus {
      border-color: var(--primary);
    }

    button.action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
    }

    button.action-btn:hover { background: var(--primary-hover); }
    button.action-btn:disabled { background: #334155; cursor: not-allowed; }

    #mic-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 18px;
      padding: 11px 14px;
      min-width: 44px;
      min-height: 44px;
    }

    #mic-btn.listening {
      background: #dc2626;
      border-color: #ef4444;
      animation: pulse-mic 1.2s infinite;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 900px) {
      #main-container { flex-direction: column; overflow: hidden; }
      #avatar-panel { flex: none; height: 38dvh; min-height: 38dvh; width: 100%; }
      #map-panel {
        flex: 1; min-height: 0; width: 100%; border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px; gap: 10px;
      }
      .row { grid-template-columns: 95px 1fr; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.1.0/modules/talkinghead.mjs"
      }
    }
  </script>
</head>
<body>

  <div id="main-container">
    <div id="avatar-panel">
      <div class="blurred-background"></div>
      <div class="vignette-overlay"></div>
      <div id="avatar-view"></div>
      <div id="status-overlay">Caricamento assistente...</div>
    </div>

    <div id="map-panel">
      <div id="user-profile-bar">
        <label for="my-surname-input">👤 Il tuo cognome:</label>
        <input type="text" id="my-surname-input" placeholder="Es. Cassarino..." />
      </div>

      <div class="card" id="info-card" aria-live="polite">
        <h3 id="card-title">In attesa di richiesta...</h3>
        <div>
          <span id="card-badge" style="display:none;" class="badge"></span>
          <span id="card-location-badge" style="display:none;" class="badge location"></span>
        </div>
        <div id="card-desc">Chiedi: «Dove si trova la 4ITA alla terza ora?», «Cosa ha Curtolo domani?» o «Quando è il collegio docenti?»</div>
        <div id="result-lines"></div>
        <div id="card-note"></div>
      </div>
    </div>
  </div>

  <div id="ui-bar">
    <input type="text" id="query-input" aria-label="Domanda orario" placeholder="Es. Dove si trova la 4ITA alla terza ora?" disabled />
    <button class="action-btn" id="search-btn" disabled>Cerca</button>
    <button class="action-btn" id="mic-btn" disabled title="Dettatura vocale" aria-label="Attiva microfono">🎙️</button>
  </div>

  <script type="module">
    import { TalkingHead } from 'talkinghead';
    import { buildIndex, parseQuery, answer } from './public/js/query-engine.js';

    const avatarContainer = document.getElementById('avatar-view');
    const statusOverlay = document.getElementById('status-overlay');
    const inputField = document.getElementById('query-input');
    const mySurnameInput = document.getElementById('my-surname-input');
    const searchBtn = document.getElementById('search-btn');
    const micBtn = document.getElementById('mic-btn');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const cardBadge = document.getElementById('card-badge');
    const cardLocationBadge = document.getElementById('card-location-badge');
    const cardNote = document.getElementById('card-note');
    const resultLines = document.getElementById('result-lines');

    let orarioIdx = null;
    let isSpeaking = false;
    let isListening = false;
    let currentJaw = 0;
    let lastJawUpdate = 0;
    let activeUtterance = null;
    const morphMeshes = [];

    let myTeacherName = localStorage.getItem('negrelli_my_surname') || "";
    mySurnameInput.value = myTeacherName;

    mySurnameInput.addEventListener('change', () => {
      myTeacherName = mySurnameInput.value.trim();
      localStorage.setItem('negrelli_my_surname', myTeacherName);
      if (myTeacherName && orarioIdx) handleQuery("cosa ho oggi");
    });

    async function loadSchedule() {
      try {
        const res = await fetch('./public/data/orario_completo.json');
        if (!res.ok) throw new Error("File orario_completo.json non trovato");
        const json = await res.json();
        orarioIdx = buildIndex(json);
      } catch (e) {
        console.warn("Caricamento orario_completo.json fallito, fallback su orario.json:", e);
        try {
          const resFallback = await fetch('./public/data/orario.json');
          if (resFallback.ok) {
            const jsonFallback = await resFallback.json();
            orarioIdx = buildIndex({
              meta: { ore: [{ ora: 1, inizio: "7:50" }, { ora: 2, inizio: "8:45" }, { ora: 3, inizio: "9:40" }, { ora: 4, inizio: "11:00" }, { ora: 5, inizio: "11:55" }, { ora: 6, inizio: "12:50" }] },
              docenti: Object.fromEntries(Object.entries(jsonFallback.docenti || {}).map(([k, v]) => [k, { nome: k, senza_nome: false, orario: v }])),
              classi: {},
              aule: jsonFallback.aule || {},
              aule_libere: {}
            });
          }
        } catch (err2) {
          console.error("Nessun database orario disponibile:", err2);
        }
      }
    }

    // Normalizzazione parlata estesa per Web Speech API su tutte le ore (1ª-8ª)
    function sanitizeForSpeech(text) {
      if (!text) return "";
      const ORD = {
        1: "prima", 2: "seconda", 3: "terza", 4: "quarta",
        5: "quinta", 6: "sesta", 7: "settima", 8: "ottava"
      };
      return text
        .replace(/\b([1-8])ª\s*ora\b/gi, (m, n) => `in ${ORD[n] || n} ora`)
        .replace(/\b([1-8])ª\b/gi, (m, n) => ORD[n] || n)
        .replace(/\b1ITA\b/gi, "prima I.T.A.")
        .replace(/\b2ITA\b/gi, "seconda I.T.A.")
        .replace(/\b3ITA\b/gi, "terza I.T.A.")
        .replace(/\b4ITA\b/gi, "quarta I.T.A.")
        .replace(/\b5ITA\b/gi, "quinta I.T.A.")
        .replace(/\b1ITE\b/gi, "prima I.T.E.")
        .replace(/\b1BTA\b/gi, "prima B.T.A.")
        .replace(/\b1BTB\b/gi, "prima B.T.B.")
        .replace(/\b2CAT\b/gi, "seconda C.A.T.")
        .replace(/\b4EE\b/gi, "quarta E.E.")
        .replace(/\bLab\b/gi, "Laboratorio")
        .replace(/\bdisposizione\b/gi, "a disposizione")
        .replace(/\s+/g, " ")
        .trim();
    }

    function speak(speechText) {
      if (!speechText) return;
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }

      const cleanText = sanitizeForSpeech(speechText);
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'it-IT';
      utterance.rate = 1.02;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const itVoice = voices.find(v => v.lang.includes('it') && (v.name.includes('Elsa') || v.name.includes('Alice') || v.name.includes('Federica') || v.name.includes('Google') || v.name.includes('Natural')));
      if (itVoice) utterance.voice = itVoice;

      utterance.onstart = () => {
        isSpeaking = true;
      };

      utterance.onend = () => {
        isSpeaking = false;
        currentJaw = 0;
      };

      utterance.onerror = () => {
        isSpeaking = false;
        currentJaw = 0;
      };

      activeUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Rendering sicuro del contenuto e del Badge di Posizione Smart
    function renderAnswer(a) {
      cardTitle.textContent = a.title || "";
      cardBadge.style.display = a.badge ? "inline-block" : "none";
      cardBadge.textContent = a.badge || "";
      cardDesc.style.display = (a.lines && a.lines.length) ? "none" : "block";
      cardNote.textContent = a.note || "";

      // Determinazione Smart di Piano e Aula con ombra pulsante
      const roomNames = a.rooms || [];
      const roomNumbers = [];
      let isPalestra = false;
      let isRizzarda = false;
      let primaryRoomName = "";

      roomNames.forEach(rName => {
        if (/palestra/i.test(rName)) isPalestra = true;
        if (/rizzarda/i.test(rName)) isRizzarda = true;
        const numMatch = rName.match(/\b\d{3}\b/);
        if (numMatch && !roomNumbers.includes(numMatch[0])) roomNumbers.push(numMatch[0]);
        if (!primaryRoomName && rName) primaryRoomName = rName;
      });

      if (roomNumbers.length > 0) {
        const firstNum = roomNumbers[0];
        const floorChar = firstNum[0];
        let floorText = "PIANO TERRA";
        if (floorChar === '1') floorText = "1° PIANO";
        else if (floorChar === '2') floorText = "2° PIANO";

        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = `📍 ${floorText} • AULA ${firstNum}`;
      } else if (isPalestra) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "📍 PIANO TERRA • PALESTRA";
      } else if (isRizzarda) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "📍 SEDE RIZZARDA";
      } else if (primaryRoomName) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = `📍 ${primaryRoomName.toUpperCase()}`;
      } else {
        cardLocationBadge.style.display = "none";
      }

      resultLines.replaceChildren(...(a.lines || []).map(l => {
        const row = document.createElement('div');
        row.className = 'row' + (l.heading ? ' heading' : '');

        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = l.when || "";
        row.appendChild(when);

        if (!l.heading) {
          const body = document.createElement('div');
          const main = document.createElement('div');
          main.className = 'main';
          main.textContent = l.main || "";
          body.appendChild(main);

          if (l.sub) {
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = l.sub;
            body.appendChild(sub);
          }
          row.appendChild(body);
        }
        return row;
      }));
    }

    function handleQuery(text) {
      if (!orarioIdx) {
        speak("Il database dell'orario non è ancora disponibile.");
        return;
      }
      const parsed = parseQuery(text, orarioIdx, { now: new Date(), me: myTeacherName });
      const a = answer(parsed, orarioIdx);
      renderAnswer(a);
      speak(a.speech);
    }

    function updateMouthAnimation(now) {
      if (now === lastJawUpdate) return;
      lastJawUpdate = now;

      if (isSpeaking) {
        const t = now * 0.015;
        const rawWave = Math.sin(t) * 0.5 + Math.sin(t * 1.8) * 0.3 + Math.sin(t * 0.4) * 0.2;
        const targetJaw = Math.max(0, Math.min(0.75, rawWave * 1.2));
        currentJaw += (targetJaw - currentJaw) * 0.35;
      } else {
        currentJaw += (0 - currentJaw) * 0.25;
        if (currentJaw < 0.005) currentJaw = 0;
      }
    }

    async function init() {
      await loadSchedule();

      // Avatar 3D protetto con blocco try...catch...finally per massima resilienza
      try {
        const head = new TalkingHead(avatarContainer, {
          ttsEndpoint: "https://dummy-tts.local",
          cameraView: "upper"
        });

        await head.showAvatar({
          url: './public/models/avatar.glb',
          body: 'F',
          avatarMood: 'neutral'
        });

        if (head.renderer) {
          head.renderer.setClearColor(0x000000, 0);
          head.renderer.domElement.style.background = 'transparent';
        }
        if (head.scene) {
          head.scene.background = null;
        }

        head.scene.traverse((node) => {
          if (node.isMesh && node.morphTargetDictionary) {
            const dict = node.morphTargetDictionary;
            const jawIdx = dict['jawOpen'] ?? dict['mouthOpen'] ?? dict['viseme_aa'];
            const funnelIdx = dict['mouthFunnel'] ?? dict['viseme_O'];

            if (jawIdx !== undefined) {
              morphMeshes.push({ mesh: node, jawIdx, funnelIdx });
              node.onBeforeRender = () => {
                updateMouthAnimation(performance.now());
                node.morphTargetInfluences[jawIdx] = currentJaw;
                if (funnelIdx !== undefined) node.morphTargetInfluences[funnelIdx] = currentJaw * 0.3;
              };
            }
          }
        });

        window.addEventListener('resize', () => {
          if (head && typeof head.onResize === 'function') {
            head.onResize();
          }
        });
      } catch (err) {
        console.warn("Avatar 3D non caricato o non supportato su questo dispositivo:", err);
      } finally {
        statusOverlay.style.display = 'none';
        inputField.disabled = false;
        searchBtn.disabled = false;
        micBtn.disabled = false;
      }

      function submitSearch() {
        const val = inputField.value.trim();
        if (val) handleQuery(val);
      }

      searchBtn.addEventListener('click', submitSearch);
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      // Microfono Web Speech
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognizer = new SpeechRecognition();
        recognizer.lang = 'it-IT';
        recognizer.continuous = false;

        micBtn.addEventListener('click', () => {
          if (isListening) {
            try { recognizer.stop(); } catch(e){}
            isListening = false;
            micBtn.classList.remove('listening');
          } else {
            try {
              recognizer.start();
              isListening = true;
              micBtn.classList.add('listening');
            } catch(e) {
              isListening = false;
              micBtn.classList.remove('listening');
            }
          }
        });

        recognizer.onresult = (evt) => {
          const spokenText = evt.results[0][0].transcript;
          inputField.value = spokenText;
          handleQuery(spokenText);
        };

        recognizer.onend = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };

        recognizer.onerror = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };
      } else {
        micBtn.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
