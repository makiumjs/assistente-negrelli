<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Assistente Orario ITIS Negrelli Feltre</title>
  <style>
    :root {
      --bg-dark: #0b0d13;
      --card-bg: rgba(22, 27, 39, 0.92);
      --card-border: rgba(56, 68, 100, 0.6);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    #main-container {
      flex: 1;
      min-height: 0;
      display: flex;
      width: 100%;
      position: relative;
    }

    /* Pannello Avatar */
    #avatar-panel {
      flex: 1.15;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .blurred-background {
      position: absolute;
      inset: -15px;
      background-image: url('./public/img/sfondo.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(6px) brightness(0.68) saturate(1.1);
      transform: scale(1.05);
      z-index: 1;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(11, 13, 19, 0.85) 100%);
      z-index: 2;
      pointer-events: none;
    }

    #avatar-view {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    #avatar-view canvas {
      background: transparent !important;
    }

    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: var(--text-muted);
      z-index: 4;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
    }

    /* Pannello Dati e Mappa */
    #map-panel {
      flex: 0.85;
      min-height: 0;
      background: var(--bg-dark);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      z-index: 10;
    }

    #user-profile-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 22, 34, 0.8);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #user-profile-bar label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    #my-surname-input {
      flex: 1;
      background: #090b10;
      border: 1px solid #2e384f;
      color: #fff;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 5px;
      outline: none;
    }

    #my-surname-input:focus {
      border-color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      backdrop-filter: blur(10px);
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #info-card h3 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: var(--accent);
      line-height: 1.3;
    }

    #card-desc {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    #card-note {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: var(--primary);
      color: white;
      margin-top: 4px;
      margin-right: 4px;
    }

    .badge.location {
      background: #0d9488;
    }

    .row {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .row.heading {
      display: block;
      font-weight: 700;
      color: var(--accent);
      padding-top: 10px;
    }

    .row .when {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .row .main {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .row .sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Selettore Piano & Vista Mappa */
    .floor-selector {
      display: flex;
      gap: 6px;
    }

    .floor-btn {
      flex: 1;
      min-height: 38px;
      background: #1c2230;
      border: 1px solid #2f384f;
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .floor-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.35);
    }

    #map-viewport {
      height: 140px;
      min-height: 120px;
      background: #0f121a;
      border: 1px solid #242c3f;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    svg {
      width: 98%;
      height: 98%;
    }

    .room {
      fill: #192030;
      stroke: #334155;
      stroke-width: 1.5;
      rx: 5;
      transition: fill 0.3s, stroke 0.3s, filter 0.3s;
    }

    .room-label {
      fill: #94a3b8;
      font-size: 8.5px;
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
    }

    .room.highlight {
      fill: #1d4ed8;
      stroke: #60a5fa;
      stroke-width: 2.5;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .room.highlight + .room-label {
      fill: #ffffff;
      font-weight: 700;
      font-size: 9.5px;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.5)); }
      50% { filter: drop-shadow(0 0 14px rgba(96, 165, 250, 0.85)); }
    }

    /* Barra Input Fisso in Basso */
    #ui-bar {
      flex-shrink: 0;
      width: 100%;
      background: #11141c;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
    }

    input[type="text"]#query-input {
      flex: 1;
      max-width: 480px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0a0c10;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]#query-input:focus {
      border-color: var(--primary);
    }

    button.action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 16px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
    }

    button.action-btn:hover { background: var(--primary-hover); }
    button.action-btn:disabled { background: #334155; cursor: not-allowed; }

    #mic-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 16px;
      padding: 11px 14px;
      min-width: 44px;
      min-height: 44px;
    }

    #mic-btn.listening {
      background: #dc2626;
      border-color: #ef4444;
      animation: pulse-mic 1.2s infinite;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 900px) {
      #main-container { flex-direction: column; overflow: hidden; }
      #avatar-panel { flex: none; height: 42dvh; min-height: 42dvh; width: 100%; }
      #map-panel {
        flex: 1; min-height: 0; width: 100%; border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 12px; gap: 6px;
      }
      #map-viewport { height: 110px; min-height: 100px; flex: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.1.0/modules/talkinghead.mjs"
      }
    }
  </script>
</head>
<body>

  <div id="main-container">
    <div id="avatar-panel">
      <div class="blurred-background"></div>
      <div class="vignette-overlay"></div>
      <div id="avatar-view"></div>
      <div id="status-overlay">Caricamento assistente...</div>
    </div>

    <div id="map-panel">
      <div id="user-profile-bar">
        <label for="my-surname-input">👤 Il tuo cognome:</label>
        <input type="text" id="my-surname-input" placeholder="Es. Cassarino..." />
      </div>

      <div class="card" id="info-card" aria-live="polite">
        <h3 id="card-title">In attesa di richiesta...</h3>
        <div>
          <span id="card-badge" style="display:none;" class="badge"></span>
          <span id="card-location-badge" style="display:none;" class="badge location"></span>
        </div>
        <div id="card-desc">Chiedi: «Dove si trova la 4ITA alla terza ora?», «Cosa ha Curtolo domani?» o «Quali laboratori sono liberi mercoledì alla seconda ora?»</div>
        <div id="result-lines"></div>
        <div id="card-note"></div>
      </div>

      <div class="floor-selector">
        <button class="floor-btn" data-floor="0">Piano Terra</button>
        <button class="floor-btn" data-floor="1">1° Piano</button>
        <button class="floor-btn active" data-floor="2">2° Piano</button>
      </div>

      <div id="map-viewport">
        <svg id="svg-map" viewBox="0 0 500 320" aria-label="Mappa dei piani ITIS Negrelli">
          <g id="map-corridors">
            <rect x="35" y="130" width="430" height="40" fill="#131722" stroke="#252d40" stroke-dasharray="4" rx="4" />
          </g>
          <g id="map-rooms"></g>
        </svg>
      </div>
    </div>
  </div>

  <div id="ui-bar">
    <input type="text" id="query-input" aria-label="Domanda orario" placeholder="Es. Dove si trova la 4ITA alla terza ora?" disabled />
    <button class="action-btn" id="search-btn" disabled>Cerca</button>
    <button class="action-btn" id="mic-btn" disabled title="Dettatura vocale" aria-label="Attiva microfono">🎙️</button>
  </div>

  <script type="module">
    import { TalkingHead } from 'talkinghead';
    import { buildIndex, parseQuery, answer } from './public/js/query-engine.js';

    const avatarContainer = document.getElementById('avatar-view');
    const statusOverlay = document.getElementById('status-overlay');
    const inputField = document.getElementById('query-input');
    const mySurnameInput = document.getElementById('my-surname-input');
    const searchBtn = document.getElementById('search-btn');
    const micBtn = document.getElementById('mic-btn');
    const mapRoomsGroup = document.getElementById('map-rooms');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    const cardBadge = document.getElementById('card-badge');
    const cardLocationBadge = document.getElementById('card-location-badge');
    const cardNote = document.getElementById('card-note');
    const resultLines = document.getElementById('result-lines');
    const floorButtons = document.querySelectorAll('.floor-btn');

    let orarioIdx = null;
    let isSpeaking = false;
    let isListening = false;
    let currentJaw = 0;
    let lastJawUpdate = 0;
    let activeUtterance = null;
    let activeHighlightRooms = [];
    const morphMeshes = [];
    let currentFloor = "2";

    let myTeacherName = localStorage.getItem('negrelli_my_surname') || "";
    mySurnameInput.value = myTeacherName;

    mySurnameInput.addEventListener('change', () => {
      myTeacherName = mySurnameInput.value.trim();
      localStorage.setItem('negrelli_my_surname', myTeacherName);
      if (myTeacherName && orarioIdx) handleQuery("cosa ho oggi");
    });

    const floorLayouts = {
      "0": [
        { id: "014", name: "Aula 014", x: 40, y: 45, w: 68, h: 72 },
        { id: "015", name: "Aula 015", x: 114, y: 45, w: 68, h: 72 },
        { id: "016", name: "Aula 016", x: 188, y: 45, w: 68, h: 72 },
        { id: "017", name: "Aula 017", x: 262, y: 45, w: 68, h: 72 },
        { id: "018", name: "Lab. Linux 018", x: 336, y: 45, w: 124, h: 72 },
        { id: "019", name: "Aula 019", x: 40, y: 180, w: 75, h: 72 },
        { id: "020", name: "Lab. Multim. 020", x: 122, y: 180, w: 135, h: 72 },
        { id: "022", name: "Aula 022", x: 264, y: 180, w: 196, h: 72 }
      ],
      "1": [
        { id: "110", name: "Aula 110", x: 40, y: 45, w: 56, h: 72 },
        { id: "111", name: "Aula 111", x: 101, y: 45, w: 56, h: 72 },
        { id: "112", name: "Aula 112", x: 162, y: 45, w: 56, h: 72 },
        { id: "113", name: "Aula 113", x: 223, y: 45, w: 56, h: 72 },
        { id: "114", name: "Aula 114", x: 284, y: 45, w: 56, h: 72 },
        { id: "115", name: "Aula 115", x: 345, y: 45, w: 56, h: 72 },
        { id: "116", name: "Aula 116", x: 406, y: 45, w: 56, h: 72 },
        { id: "117", name: "CAD 117", x: 40, y: 180, w: 64, h: 72 },
        { id: "118", name: "Costr. 118", x: 110, y: 180, w: 68, h: 72 },
        { id: "129", name: "Disegno 129", x: 184, y: 180, w: 68, h: 72 },
        { id: "130", name: "Spazio 130", x: 258, y: 180, w: 48, h: 72 },
        { id: "131", name: "Spazio 131", x: 312, y: 180, w: 48, h: 72 },
        { id: "134", name: "Aula 134", x: 366, y: 180, w: 46, h: 72 },
        { id: "135", name: "Fisica 135", x: 418, y: 180, w: 46, h: 72 }
      ],
      "2": [
        { id: "201", name: "Aula 201", x: 40, y: 45, w: 56, h: 72 },
        { id: "202", name: "Aula 202", x: 102, y: 45, w: 56, h: 72 },
        { id: "203", name: "Aula 203", x: 164, y: 45, w: 56, h: 72 },
        { id: "204", name: "Aula 204", x: 226, y: 45, w: 56, h: 72 },
        { id: "205", name: "Aula 205", x: 288, y: 45, w: 56, h: 72 },
        { id: "209", name: "Aula 209", x: 350, y: 45, w: 54, h: 72 },
        { id: "224", name: "Aula 224", x: 410, y: 45, w: 52, h: 72 },
        { id: "206", name: "Info 206", x: 40, y: 180, w: 85, h: 72 },
        { id: "208", name: "Elettronica 208", x: 132, y: 180, w: 105, h: 72 },
        { id: "210", name: "Lingue 210", x: 244, y: 180, w: 70, h: 72 },
        { id: "213", name: "Spazio 213", x: 320, y: 180, w: 42, h: 72 },
        { id: "214", name: "Spazio 214", x: 368, y: 180, w: 42, h: 72 },
        { id: "223", name: "Sistemi 223", x: 416, y: 180, w: 48, h: 72 }
      ]
    };

    function renderMap(floor, highlightList = null) {
      currentFloor = floor;
      floorButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.floor === floor);
      });

      if (highlightList !== null) {
        activeHighlightRooms = Array.isArray(highlightList) ? highlightList : [highlightList];
      }

      mapRoomsGroup.replaceChildren();
      const rooms = floorLayouts[floor] || [];

      rooms.forEach(r => {
        const isTarget = activeHighlightRooms.some(target => {
          const tClean = String(target).toLowerCase();
          return r.id === tClean || r.name.toLowerCase().includes(tClean);
        });

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", r.x);
        rect.setAttribute("y", r.y);
        rect.setAttribute("width", r.w);
        rect.setAttribute("height", r.h);
        rect.setAttribute("class", `room ${isTarget ? 'highlight' : ''}`);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", r.x + r.w / 2);
        text.setAttribute("y", r.y + r.h / 2 + 3.5);
        text.setAttribute("class", "room-label");
        text.textContent = r.name;

        mapRoomsGroup.appendChild(rect);
        mapRoomsGroup.appendChild(text);
      });
    }

    async function loadSchedule() {
      try {
        const res = await fetch('./public/data/orario_completo.json');
        if (!res.ok) throw new Error("File orario_completo.json non trovato");
        const json = await res.json();
        orarioIdx = buildIndex(json);
      } catch (e) {
        console.warn("Caricamento orario_completo.json fallito, fallback su orario.json:", e);
        try {
          const resFallback = await fetch('./public/data/orario.json');
          if (resFallback.ok) {
            const jsonFallback = await resFallback.json();
            orarioIdx = buildIndex({
              meta: { ore: [{ ora: 1, inizio: "8:00" }, { ora: 2, inizio: "8:55" }, { ora: 3, inizio: "9:50" }, { ora: 4, inizio: "11:00" }, { ora: 5, inizio: "12:00" }] },
              docenti: Object.fromEntries(Object.entries(jsonFallback.docenti || {}).map(([k, v]) => [k, { nome: k, senza_nome: false, orario: v }])),
              classi: {},
              aule: jsonFallback.aule || {},
              aule_libere: {}
            });
          }
        } catch (err2) {
          console.error("Nessun database orario disponibile:", err2);
        }
      }
    }

    // Normalizzazione parlata estesa per Web Speech API su tutte le ore (1ª-8ª)
    function sanitizeForSpeech(text) {
      if (!text) return "";
      const ORD = {
        1: "prima", 2: "seconda", 3: "terza", 4: "quarta",
        5: "quinta", 6: "sesta", 7: "settima", 8: "ottava"
      };
      return text
        .replace(/\[\vert{}\]/g, "")
        .replace(/\bLab\.?\s+/gi, "Laboratorio ")
        .replace(/\bTecn\.?\s+/gi, "Tecnologie ")
        .replace(/\bProg\.?\s+/gi, "Progettazione ")
        .replace(/\bSist\.?\s+/gi, "Sistemi ")
        .replace(/\bInf\.?\s+/gi, "Informatiche ")
        .replace(/\bCostr\.?\s+/gi, "Costruzioni ")
        .replace(/\bElett\.?\s+/gi, "Elettroniche ")
        .replace(/\bSta\b/gi, "Scienze applicate")
        .replace(/\bIrc\b/gi, "I R C")
        .replace(/\b([1-8])\s*(?:ª|°|a)?\s*ora\b/gi, (m, d) => `${ORD[d] || d} ora`)
        .replace(/\b([1-8])([A-Z]{2,5})\b/g, (m, d, l) => `${ORD[d] || d} ${l.split("").join(" ")}`)
        .replace(/_([a-z]+)\s*(\d)/gi, "Cattedra $1 $2")
        .replace(/\binsieme a il\b/gi, "insieme al")
        .replace(/\binsieme a la\b/gi, "insieme alla")
        .replace(/\s+/g, " ")
        .trim();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      currentJaw = 0;

      const cleanVoiceText = sanitizeForSpeech(text);
      const utterance = new SpeechSynthesisUtterance(cleanVoiceText);
      activeUtterance = utterance;
      utterance.lang = 'it-IT';
      utterance.rate = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const itVoice = voices.find(v => v.lang && (v.lang.startsWith('it') || v.lang.startsWith('IT')));
      if (itVoice) utterance.voice = itVoice;

      utterance.onstart = () => { isSpeaking = true; };
      utterance.onend = () => { isSpeaking = false; activeUtterance = null; currentJaw = 0; };
      utterance.onerror = () => { isSpeaking = false; activeUtterance = null; currentJaw = 0; };

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Rendering sicuro (textContent, replacement sicuro senza innerHTML)
    function renderAnswer(a) {
      cardTitle.textContent = a.title || "";
      cardBadge.style.display = a.badge ? "inline-block" : "none";
      cardBadge.textContent = a.badge || "";
      cardDesc.style.display = (a.lines && a.lines.length) ? "none" : "block";
      cardNote.textContent = a.note || "";

      // Aggiornamento badge location e gestione mappa interattiva
      const roomNumbers = [];
      let isPalestra = false;
      let isRizzarda = false;

      (a.rooms || []).forEach(rName => {
        if (/palestra/i.test(rName)) isPalestra = true;
        if (/rizzarda/i.test(rName)) isRizzarda = true;
        const numMatch = rName.match(/\b\d{3}\b/);
        if (numMatch && !roomNumbers.includes(numMatch[0])) roomNumbers.push(numMatch[0]);
      });

      if (isPalestra) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "PALESTRA";
      } else if (isRizzarda) {
        cardLocationBadge.style.display = "inline-block";
        cardLocationBadge.textContent = "SEDE RIZZARDA";
      } else {
        cardLocationBadge.style.display = "none";
      }

      if (roomNumbers.length > 0) {
        const floorTarget = roomNumbers[0][0];
        const nextFloor = ['0', '1', '2'].includes(floorTarget) ? floorTarget : currentFloor;
        renderMap(nextFloor, roomNumbers);
      } else {
        renderMap(currentFloor, []);
      }

      resultLines.replaceChildren(...(a.lines || []).map(l => {
        const row = document.createElement('div');
        row.className = 'row' + (l.heading ? ' heading' : '');

        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = l.when || "";
        row.appendChild(when);

        if (!l.heading) {
          const body = document.createElement('div');
          const main = document.createElement('div');
          main.className = 'main';
          main.textContent = l.main || "";
          body.appendChild(main);

          if (l.sub) {
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = l.sub;
            body.appendChild(sub);
          }
          row.appendChild(body);
        }
        return row;
      }));
    }

    function handleQuery(text) {
      if (!orarioIdx) {
        speak("Il database dell'orario non è ancora disponibile.");
        return;
      }
      const parsed = parseQuery(text, orarioIdx, { now: new Date(), me: myTeacherName });
      const a = answer(parsed, orarioIdx);
      renderAnswer(a);
      speak(a.speech);
    }

    function updateMouthAnimation(now) {
      if (now === lastJawUpdate) return;
      lastJawUpdate = now;

      if (isSpeaking) {
        const t = now * 0.015;
        const rawWave = Math.sin(t) * 0.5 + Math.sin(t * 1.8) * 0.3 + Math.sin(t * 0.4) * 0.2;
        const targetJaw = Math.max(0, Math.min(0.75, rawWave * 1.2));
        currentJaw += (targetJaw - currentJaw) * 0.35;
      } else {
        currentJaw += (0 - currentJaw) * 0.25;
        if (currentJaw < 0.005) currentJaw = 0;
      }
    }

    async function init() {
      renderMap("2");
      floorButtons.forEach(btn => {
        btn.addEventListener('click', () => renderMap(btn.dataset.floor, activeHighlightRooms));
      });

      await loadSchedule();

      // Avatar 3D protetto con blocco try...catch...finally per massima resilienza
      try {
        const head = new TalkingHead(avatarContainer, {
          ttsEndpoint: "https://dummy-tts.local",
          cameraView: "upper"
        });

        await head.showAvatar({
          url: './public/models/avatar.glb',
          body: 'F',
          avatarMood: 'neutral'
        });

        if (head.renderer) {
          head.renderer.setClearColor(0x000000, 0);
          head.renderer.domElement.style.background = 'transparent';
        }
        if (head.scene) {
          head.scene.background = null;
        }

        head.scene.traverse((node) => {
          if (node.isMesh && node.morphTargetDictionary) {
            const dict = node.morphTargetDictionary;
            const jawIdx = dict['jawOpen'] ?? dict['mouthOpen'] ?? dict['viseme_aa'];
            const funnelIdx = dict['mouthFunnel'] ?? dict['viseme_O'];

            if (jawIdx !== undefined) {
              morphMeshes.push({ mesh: node, jawIdx, funnelIdx });
              node.onBeforeRender = () => {
                updateMouthAnimation(performance.now());
                node.morphTargetInfluences[jawIdx] = currentJaw;
                if (funnelIdx !== undefined) node.morphTargetInfluences[funnelIdx] = currentJaw * 0.3;
              };
            }
          }
        });

        window.addEventListener('resize', () => {
          if (head && typeof head.onResize === 'function') {
            head.onResize();
          }
        });
      } catch (err) {
        console.warn("Avatar 3D non caricato o non supportato su questo dispositivo:", err);
      } finally {
        statusOverlay.style.display = 'none';
        inputField.disabled = false;
        searchBtn.disabled = false;
        micBtn.disabled = false;
      }

      function submitSearch() {
        const val = inputField.value.trim();
        if (val) handleQuery(val);
      }

      searchBtn.addEventListener('click', submitSearch);
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      // Microfono Web Speech
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognizer = new SpeechRecognition();
        recognizer.lang = 'it-IT';
        recognizer.continuous = false;

        micBtn.addEventListener('click', () => {
          if (isListening) {
            try { recognizer.stop(); } catch(e){}
            isListening = false;
            micBtn.classList.remove('listening');
          } else {
            try {
              recognizer.start();
              isListening = true;
              micBtn.classList.add('listening');
            } catch(e) {
              isListening = false;
              micBtn.classList.remove('listening');
            }
          }
        });

        recognizer.onresult = (evt) => {
          const spokenText = evt.results[0][0].transcript;
          inputField.value = spokenText;
          handleQuery(spokenText);
        };

        recognizer.onend = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };

        recognizer.onerror = () => {
          isListening = false;
          micBtn.classList.remove('listening');
        };
      } else {
        micBtn.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
